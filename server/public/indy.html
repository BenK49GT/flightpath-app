<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flightpath — Indy map video</title>
  <style>
    :root {
      --bg: #1a1510;
      --panel: #2a2218;
      --text: #f5e6c8;
      --muted: #c9b896;
      --accent: #c43a32;
      --border: #5c4a3a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      line-height: 1.45;
    }
    .wrap {
      max-width: 52rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 {
      font-weight: 600;
      font-size: 1.55rem;
      margin: 0 0 0.35rem;
      letter-spacing: 0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="text"], select {
      width: 100%;
      max-width: 20rem;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #0f0c09;
      color: var(--text);
      font-size: 1rem;
    }
    button {
      margin-top: 0.75rem;
      padding: 0.55rem 1.1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { margin-bottom: 1rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.1rem;
      margin-top: 1.25rem;
    }
    .err {
      color: #f8a8a4;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      white-space: pre-wrap;
    }
    .hint { font-size: 0.82rem; color: var(--muted); margin-top: 0.5rem; }
    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 4px;
      margin-top: 0.75rem;
      border: 1px solid var(--border);
    }
    .status { font-size: 0.9rem; color: var(--muted); margin-top: 0.5rem; }
    .dates-list { max-height: 12rem; overflow-y: auto; margin-top: 0.5rem; }
    .dates-list button {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 0.35rem;
      background: #3d3228;
      color: var(--text);
    }
    .dates-list button.selected { outline: 2px solid var(--accent); }
    .busy-block {
      margin-top: 0.65rem;
      max-width: 28rem;
    }
    .busy-block[hidden] { display: none !important; }
    .progress-bar {
      height: 12px;
      width: 100%;
      background: #120e0a;
      border: 1px solid #7b654c;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
    }
    .progress-indeterminate {
      height: 100%;
      width: 45%;
      background:
        repeating-linear-gradient(
          -45deg,
          #d14a42 0px,
          #d14a42 10px,
          #f06c63 10px,
          #f06c63 20px
        );
      border-radius: 999px;
      animation: progressSlide 1.05s linear infinite;
    }
    @keyframes progressSlide {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(250%); }
    }
    .busy-detail {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Flightpath map video</h1>
    <p class="sub">U.S. N-number → ADS-B Exchange globe traces → parchment flight clip (with music).</p>

    <div class="panel">
      <div class="row">
        <label for="reg">N-number</label>
        <input id="reg" type="text" placeholder="N49GT" autocomplete="off" />
        <label for="mapType" style="margin-top:0.7rem;">Map type</label>
        <select id="mapType">
          <option value="osm" selected>Current underlayment (OpenStreetMap)</option>
          <option value="vfr">VFR Sectional</option>
          <option value="ifr">IFR Sectional (Area Low)</option>
        </select>
        <label for="resolution" style="margin-top:0.7rem;">Resolution</label>
        <select id="resolution">
          <option value="480p" selected>480p (free)</option>
          <option value="720p">720p (free)</option>
          <option value="1080p" disabled>1080p (paid tier soon)</option>
          <option value="1440p" disabled>1440p (paid tier soon)</option>
        </select>
        <button type="button" id="btnLoadDates">Find flight dates</button>
        <p class="hint">Scans the last ~120 UTC days on globe_history (takes a minute). Respect ADS-B Exchange terms.</p>
        <div id="scanBusy" class="busy-block" hidden>
          <p class="busy-detail">Progress</p>
          <div class="progress-bar" aria-hidden="true"><div class="progress-indeterminate"></div></div>
          <p id="scanBusyText" class="busy-detail"></p>
        </div>
      </div>
      <div id="datesSection" class="row" hidden>
        <label>Pick one or more dates</label>
        <div id="datesList" class="dates-list"></div>
        <button type="button" id="btnLoadMoreDates">Load more flights</button>
        <button type="button" id="btnRender" disabled>Generate video</button>
      </div>
      <div id="msg" class="err" hidden></div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel" id="videoPanel" hidden>
      <label>Result</label>
      <div id="renderBusy" class="busy-block" hidden>
        <p class="busy-detail">Progress</p>
        <div class="progress-bar" aria-hidden="true"><div class="progress-indeterminate"></div></div>
        <p id="renderBusyText" class="busy-detail"></p>
      </div>
      <video id="player" controls playsinline preload="metadata"></video>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const regInput = $("reg");
    const btnLoadDates = $("btnLoadDates");
    const btnLoadMoreDates = $("btnLoadMoreDates");
    const btnRender = $("btnRender");
    const mapTypeSel = $("mapType");
    const resolutionSel = $("resolution");
    const datesSection = $("datesSection");
    const datesList = $("datesList");
    const msg = $("msg");
    const statusEl = $("status");
    const videoPanel = $("videoPanel");
    const player = $("player");
    const scanBusy = $("scanBusy");
    const scanBusyText = $("scanBusyText");
    const renderBusy = $("renderBusy");
    const renderBusyText = $("renderBusyText");

    let selectedDates = new Set();
    let datesPayload = [];
    let scannedDaysBack = 120;
    const DAYS_STEP = 120;

    function showErr(text) {
      msg.hidden = !text;
      msg.textContent = text || "";
    }

    function setStatus(t) {
      statusEl.textContent = t || "";
    }

    async function readJsonOrThrow(res, context) {
      const raw = await res.text();
      if (!raw) {
        throw new Error(context + " returned an empty response.");
      }
      try {
        return JSON.parse(raw);
      } catch {
        const preview = raw.slice(0, 180).replace(/\s+/g, " ").trim();
        throw new Error(
          context +
            " returned non-JSON (" +
            res.status +
            "). " +
            (preview ? "Body: " + preview : "No readable body.") +
            " Try again in a moment.",
        );
      }
    }

    function startElapsedTicker(el, prefix) {
      const t0 = Date.now();
      const id = setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        el.textContent = prefix + " — " + s + "s elapsed";
      }, 500);
      return () => clearInterval(id);
    }

    function formatDuration(totalSec) {
      const s = Math.max(0, Number(totalSec) || 0);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      if (h > 0) return h + "h " + String(m).padStart(2, "0") + "m";
      return m + "m";
    }

    function loadVideoIntoPlayer(videoPath, jobId) {
      const url = new URL(videoPath, window.location.origin);
      url.searchParams.set("job", jobId);
      url.searchParams.set("cb", String(Date.now()));

      player.pause();
      player.removeAttribute("src");
      while (player.firstChild) player.removeChild(player.firstChild);
      player.load();

      player.addEventListener("error", () => {
        showErr("Video failed to load. Try Generate again or hard-refresh the page.");
      }, { once: true });
      player.addEventListener(
        "loadeddata",
        () => {
          setStatus("Done — clip ready.");
        },
        { once: true },
      );

      player.src = url.href;
      player.load();
    }

    function selectedDateListSortedAsc() {
      return Array.from(selectedDates).sort((a, b) => a.localeCompare(b));
    }

    function updateRenderButtonState() {
      btnRender.disabled = selectedDates.size === 0;
    }

    function renderDatesList() {
      datesList.innerHTML = "";
      for (const d of datesPayload) {
        const b = document.createElement("button");
        b.type = "button";
        const airports = Array.isArray(d.airportsVisited)
          ? d.airportsVisited
              .map((a) => {
                const c = a.code;
                const f = a.faaIdent;
                if (f) return f;
                if (!c) return null;
                const m = /^K([A-Z0-9]{3})$/.exec(c);
                return m ? m[1] : c;
              })
              .filter(Boolean)
          : [];
        const airportLabel = airports.length ? airports.join(", ") : "airport unknown";
        b.textContent = d.date + " · " + formatDuration(d.totalFlightSec) + " · " + airportLabel;
        if (selectedDates.has(d.date)) b.classList.add("selected");
        b.addEventListener("click", () => {
          if (selectedDates.has(d.date)) selectedDates.delete(d.date);
          else selectedDates.add(d.date);
          renderDatesList();
          updateRenderButtonState();
        });
        datesList.appendChild(b);
      }
    }

    async function loadDates(reg, daysBack, merge) {
      const u = new URL("/api/indy/dates", window.location.origin);
      u.searchParams.set("reg", reg);
      u.searchParams.set("daysBack", String(daysBack));
      const res = await fetch(u.toString(), { cache: "no-store" });
      const data = await readJsonOrThrow(res, "Find flight dates");
      if (!res.ok) throw new Error(data.message || data.error || res.statusText);
      const incoming = Array.isArray(data.dates) ? data.dates : [];
      if (!merge) {
        datesPayload = incoming;
      } else {
        const byDate = new Map(datesPayload.map((d) => [d.date, d]));
        for (const d of incoming) if (!byDate.has(d.date)) byDate.set(d.date, d);
        datesPayload = Array.from(byDate.values()).sort((a, b) => b.date.localeCompare(a.date));
      }
      return data;
    }

    btnLoadDates.addEventListener("click", async () => {
      showErr("");
      const reg = regInput.value.trim().toUpperCase();
      if (!reg.startsWith("N")) {
        showErr("Enter a U.S. registration starting with N (e.g. N49GT).");
        return;
      }
      btnLoadDates.disabled = true;
      scanBusy.hidden = false;
      scanBusyText.textContent = "Contacting globe_history (one request per UTC day)…";
      const stopTick = startElapsedTicker(scanBusyText, "Scanning");
      setStatus("Working… progress bar below.");
      datesSection.hidden = true;
      btnRender.disabled = true;
      selectedDates = new Set();
      scannedDaysBack = 120;
      try {
        const data = await loadDates(reg, scannedDaysBack, false);
        if (!datesPayload.length) {
          if (data.rateLimited) {
            showErr(data.message || "ADS-B Exchange rate-limited (429). Wait a few minutes and retry.");
            setStatus("Rate limited — no flight days could be loaded.");
          } else {
            setStatus("No trace days found in the scanned window for " + data.registration + ".");
          }
          return;
        }
        renderDatesList();
        datesSection.hidden = false;
        btnLoadMoreDates.hidden = false;
        setStatus(
          (data.rateLimited
            ? (data.message || "Rate limited — partial list. ") + " "
            : "") +
            "Found " +
            datesPayload.length +
            " day(s) with data in last " +
            scannedDaysBack +
            " days. Pick dates, then generate.",
        );
      } catch (e) {
        showErr(String(e.message || e));
        setStatus("");
      } finally {
        stopTick();
        scanBusy.hidden = true;
        btnLoadDates.disabled = false;
      }
    });

    btnLoadMoreDates.addEventListener("click", async () => {
      showErr("");
      const reg = regInput.value.trim().toUpperCase();
      if (!reg.startsWith("N")) {
        showErr("Enter a U.S. registration starting with N (e.g. N49GT).");
        return;
      }
      btnLoadMoreDates.disabled = true;
      scanBusy.hidden = false;
      const nextDays = Math.min(3650, scannedDaysBack + DAYS_STEP);
      scanBusyText.textContent = "Scanning older flights (" + scannedDaysBack + " → " + nextDays + " days)…";
      const stopTick = startElapsedTicker(scanBusyText, "Scanning");
      try {
        await loadDates(reg, nextDays, true);
        scannedDaysBack = nextDays;
        renderDatesList();
        datesSection.hidden = false;
        setStatus("Loaded " + datesPayload.length + " day(s) with data in last " + scannedDaysBack + " days.");
        if (scannedDaysBack >= 3650) btnLoadMoreDates.disabled = true;
      } catch (e) {
        showErr(String(e.message || e));
      } finally {
        stopTick();
        scanBusy.hidden = true;
        if (scannedDaysBack < 3650) btnLoadMoreDates.disabled = false;
      }
    });

    btnRender.addEventListener("click", async () => {
      showErr("");
      const reg = regInput.value.trim().toUpperCase();
      const mapType = mapTypeSel.value;
      const resolution = resolutionSel.value;
      const dates = selectedDateListSortedAsc();
      if (!dates.length) return;
      btnRender.disabled = true;
      videoPanel.hidden = false;
      renderBusy.hidden = false;
      renderBusyText.textContent = "Encoding (map tiles, frames, audio)…";
      const stopRenderTick = startElapsedTicker(renderBusyText, "Rendering");
      player.pause();
      player.removeAttribute("src");
      while (player.firstChild) player.removeChild(player.firstChild);
      player.load();
      setStatus("Render queued…");
      try {
        const res = await fetch("/api/indy/render", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(
            dates.length === 1
              ? { reg, date: dates[0], leg: "longest", mapType, resolution }
              : { reg, dates, leg: "longest", mapType, resolution },
          ),
        });
        const data = await readJsonOrThrow(res, "Start render");
        if (res.status === 402) throw new Error(data.message || "Selected resolution requires paid tier");
        if (res.status === 429) throw new Error(data.message || "Render queue is currently full");
        if (!res.ok) throw new Error(data.message || data.error || res.statusText);
        const jobId = data.jobId;
        if (data.status === "queued") {
          const qp = Number(data.queuePosition) || 1;
          setStatus("Queued for render (position " + qp + ").");
        }
        let transientPollFailures = 0;
        for (;;) {
          await new Promise((r) => setTimeout(r, 1200));
          let jr;
          let j;
          try {
            jr = await fetch("/api/indy/jobs/" + jobId + "?cb=" + Date.now());
            j = await readJsonOrThrow(jr, "Render status");
          } catch (pollErr) {
            transientPollFailures += 1;
            if (transientPollFailures <= 15) {
              setStatus(
                "Render is still running; waiting for server (" + transientPollFailures + " retry)…",
              );
              continue;
            }
            throw pollErr;
          }
          transientPollFailures = 0;
          if (!jr.ok) throw new Error(j.message || "Poll failed");
          if (j.status === "queued") {
            const qp = Number(j.queuePosition) || 1;
            setStatus("Queued for render (position " + qp + ").");
            continue;
          }
          if (j.status === "done") {
            if (!j.videoUrl) throw new Error("No video URL from server");
            loadVideoIntoPlayer(j.videoUrl, jobId);
            break;
          }
          if (j.status === "error") throw new Error(j.error || "Render failed");
        }
      } catch (e) {
        showErr(String(e.message || e));
        setStatus("");
      } finally {
        stopRenderTick();
        renderBusy.hidden = true;
        updateRenderButtonState();
      }
    });
  </script>
</body>
</html>
