services:
  - type: web
    name: flightpath-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Slower probes reduce ADS-B Exchange 429s between Find dates and Generate.
      - key: INDY_GLOBE_DELAY_MS
        value: 400
      - key: INDY_GLOBE_RETRY_MAX
        value: 1
      - key: INDY_GLOBE_ABORT_AFTER_429
        value: 4
      - key: INDY_GLOBE_DAYS_BACK
        value: 45
